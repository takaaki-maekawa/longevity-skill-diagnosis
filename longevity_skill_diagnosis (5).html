<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロンジェビティスキル診断 | Career Longevity</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --green: #1D9E75;
  --green-light: #E1F5EE;
  --green-dark: #0F6E56;
  --green-deeper: #085041;
  --coral: #D85A30;
  --blue: #378ADD;
  --purple: #9F3FBD;
  --red: #E24B4A;
  --amber: #BA7517;
  --forest: #3B6D11;
  --text: #1a1a1a;
  --text-muted: #666;
  --text-light: #999;
  --bg: #f8f7f4;
  --surface: #ffffff;
  --border: rgba(0,0,0,0.1);
  --radius: 12px;
  --radius-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7}
.page{max-width:680px;margin:0 auto;padding:2rem 1.25rem 4rem}

/* header */
.app-header{text-align:center;padding:2.5rem 0 2rem}
.app-header .eyebrow{font-size:12px;letter-spacing:.15em;color:var(--green);font-weight:500;text-transform:uppercase;margin-bottom:.5rem}
.app-header h1{font-family:'DM Serif Display',serif;font-size:32px;font-weight:400;color:var(--text);margin-bottom:.75rem;line-height:1.2}
.app-header p{font-size:14px;color:var(--text-muted);max-width:420px;margin:0 auto}

/* progress */
.progress-wrap{margin-bottom:1.75rem}
.progress-track{height:4px;background:rgba(0,0,0,0.08);border-radius:99px;overflow:hidden;margin-bottom:6px}
.progress-fill{height:100%;background:var(--green);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.progress-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-light)}
.progress-saved{color:var(--green);display:none;align-items:center;gap:4px}
.progress-saved.show{display:flex}

/* resume banner */
.resume-banner{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:var(--radius-sm);padding:.875rem 1rem;margin-bottom:1.25rem;display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.resume-banner.show{display:flex}
.resume-banner span{font-size:13px;color:var(--text-muted)}
.resume-actions{display:flex;gap:6px}
.btn-resume{padding:6px 14px;border-radius:var(--radius-sm);background:var(--green);color:#fff;border:none;font-size:13px;cursor:pointer;font-weight:500;font-family:inherit}
.btn-resume:hover{background:var(--green-dark)}
.btn-dismiss{padding:6px 12px;border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);border:1px solid var(--border);font-size:13px;cursor:pointer;font-family:inherit}
.btn-dismiss:hover{background:var(--bg)}

/* category badge */
.cat-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:500;margin-bottom:10px}

/* question card */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.q-num{font-size:11px;color:var(--text-light);margin-bottom:6px;letter-spacing:.05em}
.q-text{font-size:15px;color:var(--text);line-height:1.65;margin-bottom:1.25rem;font-weight:500}
.scale-wrap{display:flex;gap:6px}
.scale-btn{flex:1;padding:10px 4px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;color:var(--text-muted);text-align:center;transition:all .15s;font-family:inherit}
.scale-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-light)}
.scale-btn.selected{background:var(--green-light);border-color:var(--green);color:var(--green-dark);font-weight:700}
.scale-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-light);margin-top:6px}

/* nav */
.nav-wrap{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem}
.btn-back{padding:10px 20px;border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);border:1px solid var(--border);font-size:14px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-back:hover{background:var(--surface)}
.btn-back:invisible{visibility:hidden}
.btn-next{padding:10px 28px;border-radius:var(--radius-sm);background:var(--green);color:#fff;border:none;font-size:14px;cursor:pointer;font-weight:500;font-family:inherit;transition:all .15s}
.btn-next:hover:not(:disabled){background:var(--green-dark)}
.btn-next:disabled{opacity:.35;cursor:not-allowed}

/* result */
.result-header{text-align:center;padding:2rem 0 1.5rem}
.result-header h2{font-family:'DM Serif Display',serif;font-size:28px;font-weight:400;margin-bottom:6px}
.result-header p{font-size:14px;color:var(--text-muted)}
.chart-wrap{position:relative;width:100%;height:340px;margin-bottom:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}

/* score cards */
.scores-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:1.75rem}
.score-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.875rem;text-align:center}
.score-label{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.score-val{font-size:24px;font-weight:700;margin-bottom:6px}
.score-bar-bg{background:rgba(0,0,0,0.07);border-radius:99px;height:5px;overflow:hidden}
.score-bar-fg{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}

/* advice */
.section-heading{font-size:15px;font-weight:700;color:var(--text);margin:2rem 0 .75rem;display:flex;align-items:center;gap:8px}
.section-heading::before{content:'';display:block;width:3px;height:16px;border-radius:99px}
.section-heading.strong::before{background:var(--green)}
.section-heading.weak::before{background:var(--coral)}
.advice-list{display:flex;flex-direction:column;gap:8px}
.advice-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid;border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:1rem 1.25rem}
.advice-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.advice-name{font-size:14px;font-weight:700;color:var(--text)}
.advice-score{font-size:13px;font-weight:700}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500}
.tag-str{background:var(--green-light);color:var(--green-deeper)}
.tag-wk{background:#FAECE7;color:#712B13}
.advice-text{font-size:13px;color:var(--text-muted);line-height:1.7}

/* answer list */
.ans-group{margin-bottom:1.5rem}
.ans-group-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:2px solid;margin-bottom:8px}
.ans-group-name{font-size:14px;font-weight:700}
.ans-group-score{font-size:13px;font-weight:700}
.ans-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.06)}
.ans-row:last-child{border-bottom:none}
.ans-q{font-size:13px;color:var(--text-muted);line-height:1.5}
.ans-q .qno{font-size:11px;color:var(--text-light);margin-right:4px}
.ans-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.dots{display:flex;gap:3px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(0,0,0,0.12);background:rgba(0,0,0,0.05)}
.dot.on{border:none}
.ans-label{font-size:11px;color:var(--text-light);white-space:nowrap}

/* copy / export */
.export-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-top:2rem}
.export-box-title{font-size:14px;font-weight:700;margin-bottom:4px}
.export-box-desc{font-size:13px;color:var(--text-muted);margin-bottom:12px;line-height:1.6}
.export-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-export{padding:10px 18px;border-radius:var(--radius-sm);background:var(--green);color:#fff;border:none;font-size:13px;cursor:pointer;font-weight:500;font-family:inherit;display:flex;align-items:center;gap:6px;transition:opacity .15s}
.btn-export:hover{opacity:.85}
.btn-restart{padding:10px 18px;border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);border:1px solid var(--border);font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .15s}
.btn-restart:hover{background:var(--bg)}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* footer */
.footer{text-align:center;margin-top:3rem;font-size:12px;color:var(--text-light)}
</style>
</head>
<body>
<div class="page">

  <div id="quiz-view">
    <div class="app-header">
      <div class="eyebrow">Career Longevity</div>
      <h1>ロンジェビティスキル診断</h1>
      <p>35の質問に答えて、健康・労働長寿を支える7つの要素の強みと改善ポイントを発見しましょう。</p>
    </div>

    <div id="resume-banner" class="resume-banner">
      <span>💾 前回の回答が保存されています</span>
      <div class="resume-actions">
        <button class="btn-resume" onclick="loadSaved()">続きから再開</button>
        <button class="btn-dismiss" onclick="document.getElementById('resume-banner').classList.remove('show')">新しく始める</button>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="pbar" style="width:0%"></div></div>
      <div class="progress-meta">
        <span id="plabel">1 / 35</span>
        <span class="progress-saved" id="saved-badge">✓ 自動保存済み</span>
      </div>
    </div>

    <div id="q-area"></div>

    <div class="nav-wrap">
      <button class="btn-back" id="btn-back" onclick="go(-1)" style="visibility:hidden">← 前へ</button>
      <button class="btn-next" id="btn-next" onclick="go(1)" disabled>次へ →</button>
    </div>
    <div style="text-align:center;margin-top:1rem">
      <button onclick="testFill()" style="font-size:11px;color:#bbb;background:none;border:1px dashed #ddd;border-radius:6px;padding:4px 12px;cursor:pointer;font-family:inherit">🛠 テスト：全問自動入力</button>
    </div>
  </div>

  <div id="result-view" style="display:none">
    <div class="result-header">
      <div class="eyebrow">診断結果</div>
      <h2>あなたのロンジェビティスキル</h2>
      <p id="result-date"></p>
    </div>

    <div class="chart-wrap">
      <canvas id="radar" role="img" aria-label="ロンジェビティスキル7要素レーダーチャート"></canvas>
    </div>

    <div class="scores-grid" id="scores-grid"></div>

    <div class="section-heading strong">強み</div>
    <div class="advice-list" id="strong-list"></div>

    <div class="section-heading" style="margin-top:1.5rem"><span style="display:block;width:3px;height:16px;border-radius:99px;background:#378ADD;margin-right:8px"></span>さらに高めるヒント</div>
    <div class="advice-list" id="next-list"></div>

    <div class="section-heading weak" style="margin-top:1.5rem">改善ポイント</div>
    <div class="advice-list" id="weak-list"></div>

    <div class="section-heading" style="margin-top:2rem"><span style="display:block;width:3px;height:16px;border-radius:99px;background:#888;margin-right:8px"></span>回答一覧</div>
    <div id="ans-list"></div>

    <div class="export-box">
      <div class="export-box-title">📁 結果を保存する</div>
      <div class="export-box-desc">PDFまたはCSVで診断結果をダウンロードできます。</div>
      <div class="export-actions">
        <button class="btn-export" onclick="dlPDF()">📄 PDFダウンロード</button>
        <button class="btn-export" style="background:#378ADD" onclick="dlCSV()">⬇ CSVダウンロード</button>
        <button class="btn-restart" onclick="restart()">↺ もう一度診断する</button>
      </div>
    </div>
    <div class="footer">ロンジェビティスキル診断 © 前川隆昭 / humanfront.jp</div>
  </div>

  <!-- PDF用：セクションごとに分割してキャプチャ -->
  <div id="pdf-root" style="position:fixed;left:-9999px;top:0;font-family:'Noto Sans JP',sans-serif;background:#fff">

    <!-- P1: ヘッダー＋チャート＋スコア -->
    <div id="pdf-p1" style="width:680px;padding:40px 48px;background:#fff">
      <div style="text-align:center;margin-bottom:24px;border-bottom:2px solid #1D9E75;padding-bottom:16px">
        <div style="font-size:11px;letter-spacing:.15em;color:#1D9E75;font-weight:500;margin-bottom:4px">CAREER LONGEVITY</div>
        <div style="font-size:24px;font-weight:700;color:#1a1a1a;margin-bottom:4px">ロンジェビティスキル診断結果</div>
        <div id="pdf-date" style="font-size:12px;color:#999"></div>
      </div>
      <canvas id="pdf-radar" width="500" height="320" style="display:block;margin:0 auto 24px"></canvas>
      <div id="pdf-scores" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px"></div>
    </div>

    <!-- P2: 強み -->
    <div id="pdf-p2" style="width:680px;padding:40px 48px;background:#fff">
      <div style="font-size:15px;font-weight:700;color:#1D9E75;border-left:4px solid #1D9E75;padding-left:10px;margin-bottom:14px">強み</div>
      <div id="pdf-strong"></div>
    </div>

    <!-- P3: さらに高めるヒント＋改善ポイント（1ページ） -->
    <div id="pdf-p3" style="width:680px;padding:40px 48px;background:#fff">
      <div style="font-size:15px;font-weight:700;color:#378ADD;border-left:4px solid #378ADD;padding-left:10px;margin-bottom:14px">さらに高めるヒント</div>
      <div id="pdf-next"></div>
      <div style="font-size:15px;font-weight:700;color:#D85A30;border-left:4px solid #D85A30;padding-left:10px;margin:20px 0 14px">改善ポイント（スコア3未満の項目）</div>
      <div id="pdf-weak"></div>
    </div>

    <!-- 回答一覧：見出し＋食事＋睡眠（1ページ目） -->
    <div id="pdf-ans-pg1" style="width:680px;padding:40px 48px;background:#fff">
      <div style="font-size:15px;font-weight:700;color:#444;border-left:4px solid #888;padding-left:10px;margin-bottom:20px">回答一覧</div>
      <div id="pdf-answers-diet"></div>
      <div style="margin-top:16px" id="pdf-answers-sleep"></div>
    </div>

    <!-- 回答一覧：運動＋つながり -->
    <div id="pdf-ans-pg2" style="width:680px;padding:40px 48px;background:#fff">
      <div id="pdf-answers-exercise"></div>
      <div style="margin-top:16px" id="pdf-answers-conn"></div>
    </div>

    <!-- 回答一覧：医療＋美容 -->
    <div id="pdf-ans-pg3" style="width:680px;padding:40px 48px;background:#fff">
      <div id="pdf-answers-medical"></div>
      <div style="margin-top:16px" id="pdf-answers-beauty"></div>
    </div>

    <!-- 回答一覧：生きがい -->
    <div id="pdf-ans-pg4" style="width:680px;padding:40px 48px;background:#fff">
      <div id="pdf-answers-ikigai"></div>
    </div>

  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const SAVE_KEY = 'longevity_v1';
const cats = [
  {id:'diet',    name:'食事',    color:'#1D9E75'},
  {id:'sleep',   name:'睡眠',    color:'#378ADD'},
  {id:'exercise',name:'運動',    color:'#D85A30'},
  {id:'conn',    name:'つながり',color:'#9F3FBD'},
  {id:'medical', name:'医療',    color:'#E24B4A'},
  {id:'beauty',  name:'美容',    color:'#BA7517'},
  {id:'ikigai',  name:'生きがい',color:'#3B6D11'},
];
const qs = [
  {c:'diet',    q:'野菜・果物・魚・豆類などバランスの取れた食事を毎日意識している'},
  {c:'diet',    q:'間食や甘いものをある程度コントロールできている'},
  {c:'diet',    q:'食事の時間を大切にし、ゆっくり食べることが多い'},
  {c:'diet',    q:'自分の体重・体型を定期的に確認し、食事で管理している'},
  {c:'diet',    q:'外食やコンビニ食に頼りすぎず、食材の質を意識している'},
  {c:'sleep',   q:'毎日ほぼ同じ時間に寝て、同じ時間に起きる生活リズムがある'},
  {c:'sleep',   q:'7〜8時間程度の睡眠時間を確保できている'},
  {c:'sleep',   q:'朝起きたとき、すっきりした感覚で1日をスタートできることが多い'},
  {c:'sleep',   q:'寝つきが良く、夜中に目が覚めることが少ない'},
  {c:'sleep',   q:'睡眠の質を高めるために何らかの工夫（環境・習慣など）をしている'},
  {c:'exercise',q:'週に3回以上、意識的に体を動かす時間をとっている'},
  {c:'exercise',q:'通勤や日常の中で、できるだけ歩く・階段を使うなど体を動かしている'},
  {c:'exercise',q:'筋力・柔軟性・心肺機能など、体の状態に関心を持って管理している'},
  {c:'exercise',q:'運動の習慣が体調や仕事のパフォーマンスに良い影響を与えていると感じている'},
  {c:'exercise',q:'スポーツや運動を通じて楽しさや達成感を感じることがある'},
  {c:'conn',    q:'定期的に会う・連絡をとる友人や知人が複数いる'},
  {c:'conn',    q:'仕事以外のコミュニティ（地域・趣味・ボランティアなど）に参加している'},
  {c:'conn',    q:'困ったときに相談できる人が身近にいると感じている'},
  {c:'conn',    q:'人との関わりを大切にし、積極的に声をかけたり関係を維持したりしている'},
  {c:'conn',    q:'SNSやオンラインを含め、さまざまな世代の人とつながっている'},
  {c:'medical', q:'年1回以上、健康診断・人間ドックを受けている'},
  {c:'medical', q:'検査結果や数値の変化を確認し、必要なフォローをしている'},
  {c:'medical', q:'かかりつけ医・歯科医がいて、定期的に受診している'},
  {c:'medical', q:'自分の持病やリスクを把握し、予防的な行動をとっている'},
  {c:'medical', q:'ストレスや心の健康にも気を配り、必要に応じて専門家に相談できる'},
  {c:'beauty',  q:'肌・髪・体型など、外見の手入れを日常的に行っている'},
  {c:'beauty',  q:'服装や身だしなみに気を遣い、清潔感・活力を意識している'},
  {c:'beauty',  q:'年齢に関係なく「若々しく見られたい」という意識が自分にある'},
  {c:'beauty',  q:'外見を整えることが、自分の自信やモチベーションにつながっていると感じる'},
  {c:'beauty',  q:'美容・外見に関する知識や習慣を定期的にアップデートしている'},
  {c:'ikigai',  q:'自分の仕事や活動に「意味・意義」を感じていることが多い'},
  {c:'ikigai',  q:'将来に向けてやりたいこと・なりたい姿が明確にある'},
  {c:'ikigai',  q:'日常の中に楽しみや喜びを感じる瞬間が多い'},
  {c:'ikigai',  q:'自分の経験・強みを活かして誰かの役に立てていると感じている'},
  {c:'ikigai',  q:'健康で元気なうちは、できるだけ長く働き・活動し続けたいと思っている'},
];
const advice = {
  diet:{
    h:'食事管理が習慣化されており、栄養バランスへの意識が高い状態です。この強みを活かして、クライアントへの健康アドバイスにも具体的な食習慣の話題を取り入れてみましょう。',

const scaleText = ['','あてはまらない','あまりあてはまらない','どちらともいえない','ややあてはまる','とてもあてはまる'];

let ans = new Array(35).fill(null);
let cur = 0;
let saveTimer = null;

function cat(id){ return cats.find(c=>c.id===id); }

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}

function saveLocal(){
  if(ans.filter(a=>a!==null).length === 0) return;
  localStorage.setItem(SAVE_KEY, JSON.stringify({ans, cur, at: new Date().toISOString()}));
  document.getElementById('saved-badge').classList.add('show');
}

function checkLocal(){
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(d && d.ans && d.ans.filter(a=>a!==null).length > 0)
      document.getElementById('resume-banner').classList.add('show');
  }catch(e){}
}

function loadSaved(){
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    d.ans.forEach((v,i)=>{ ans[i]=v; });
    cur = d.cur||0;
    document.getElementById('resume-banner').classList.remove('show');
    document.getElementById('saved-badge').classList.add('show');
    render();
    toast('前回の回答を読み込みました');
  }catch(e){ toast('読み込みに失敗しました'); }
}

function render(){
  const q = qs[cur];
  const c = cat(q.c);
  const pct = Math.round((cur/35)*100);
  document.getElementById('pbar').style.width = pct+'%';
  document.getElementById('plabel').textContent = (cur+1)+' / 35';
  document.getElementById('btn-back').style.visibility = cur===0?'hidden':'visible';
  document.getElementById('btn-next').textContent = cur===34 ? '結果を見る →' : '次へ →';
  document.getElementById('btn-next').disabled = ans[cur]===null;
  const catStart = qs.findIndex(x=>x.c===q.c);
  const qn = cur - catStart + 1;
  document.getElementById('q-area').innerHTML = `
    <span class="cat-badge" style="background:${c.color}15;color:${c.color};border:1px solid ${c.color}30">
      ${c.name} &nbsp;${qn}/5
    </span>
    <div class="q-card">
      <div class="q-num">Q${cur+1}</div>
      <div class="q-text">${q.q}</div>
      <div class="scale-wrap">
        ${[1,2,3,4,5].map(v=>`<button class="scale-btn${ans[cur]===v?' selected':''}" onclick="pick(${v})">${v}</button>`).join('')}
      </div>
      <div class="scale-labels"><span>あてはまらない</span><span>とてもあてはまる</span></div>
    </div>`;
}

function pick(v){
  ans[cur] = v;
  render();
  document.getElementById('btn-next').disabled = false;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLocal, 800);
}

function go(dir){
  if(dir===1 && cur===34){ showResult(); return; }
  cur = Math.max(0, Math.min(34, cur+dir));
  render();
}

function scores(){
  return cats.map(c=>{
    const idxs = qs.reduce((a,q,i)=>{ if(q.c===c.id) a.push(i); return a; },[]);
    const total = idxs.reduce((s,i)=>s+(ans[i]||3),0);
    return { c, score: Math.round((total/5)*10)/10 };
  });
}

function showResult(){
  saveLocal();
  document.getElementById('quiz-view').style.display = 'none';
  document.getElementById('result-view').style.display = 'block';
  const now = new Date();
  document.getElementById('result-date').textContent =
    `診断日：${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

  const sc = scores();

  // radar
  new Chart(document.getElementById('radar'),{
    type:'radar',
    data:{
      labels: sc.map(s=>s.c.name),
      datasets:[{
        label:'スコア', data: sc.map(s=>s.score),
        backgroundColor:'rgba(29,158,117,0.12)',
        borderColor:'#1D9E75', borderWidth:2,
        pointBackgroundColor: sc.map(s=>s.c.color),
        pointBorderColor:'#fff', pointBorderWidth:2, pointRadius:6,
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{r:{min:1,max:5,ticks:{stepSize:1,font:{size:11},color:'#999'},
        pointLabels:{font:{size:13,family:"'Noto Sans JP',sans-serif"}},
        grid:{color:'rgba(0,0,0,0.07)'}, angleLines:{color:'rgba(0,0,0,0.07)'}}}
    }
  });

  // score cards
  document.getElementById('scores-grid').innerHTML = sc.map(s=>{
    const pct = Math.round(((s.score-1)/4)*100);
    return `<div class="score-card">
      <div class="score-label">${s.c.name}</div>
      <div class="score-val" style="color:${s.c.color}">${s.score.toFixed(1)}</div>
      <div class="score-bar-bg"><div class="score-bar-fg" style="width:${pct}%;background:${s.c.color}"></div></div>
    </div>`;
  }).join('');

  // advice
  const sorted = [...sc].sort((a,b)=>b.score-a.score);
  const sl = document.getElementById('strong-list');
  const nl = document.getElementById('next-list');
  const wl = document.getElementById('weak-list');
  sl.innerHTML = ''; nl.innerHTML = ''; wl.innerHTML = '';

  // 強み・さらに高めるヒント（要素平均3以上）
  sorted.forEach(s=>{
    if(s.score >= 3.0){
      sl.innerHTML += `<div class="advice-card" style="border-left-color:${s.c.color}">
        <div class="advice-head">
          <span class="advice-name">${s.c.name}</span>
          <span class="advice-score" style="color:${s.c.color}">${s.score.toFixed(1)}点</span>
          <span class="tag tag-str">強み</span>
        </div>
        <div class="advice-text">${advice[s.c.id].h}</div>
      </div>`;
      nl.innerHTML += `<div class="advice-card" style="border-left-color:#378ADD">
        <div class="advice-head">
          <span class="advice-name">${s.c.name}</span>
          <span class="advice-score" style="color:#378ADD">${s.score.toFixed(1)}点</span>
        </div>
        <div class="advice-text">${advice[s.c.id].n}</div>
      </div>`;
    }
  });

  // 改善ポイント：質問単位でスコア3未満のものを列挙
  let weakCount = 0;
  cats.forEach(c=>{
    const catIdxs = qs.map((q,i)=>({...q,i})).filter(q=>q.c===c.id);
    catIdxs.forEach((q, qi)=>{
      const v = ans[q.i] || 0;
      if(v > 0 && v < 3){
        wl.innerHTML += `<div class="advice-card" style="border-left-color:${c.color}">
          <div class="advice-head">
            <span class="advice-name">${c.name}</span>
            <span style="font-size:11px;color:var(--text-muted)">Q${q.i+1}</span>
            <span class="advice-score" style="color:${c.color}">${v}点</span>
            <span class="tag tag-wk">改善</span>
          </div>
          <div class="advice-text" style="font-size:12px;color:var(--text-muted);margin-bottom:4px">「${q.q}」</div>
          <div class="advice-text">${advice[c.id].q[qi]}</div>
        </div>`;
        weakCount++;
      }
    });
  });

  if(!sl.innerHTML) sl.innerHTML = '<p style="font-size:13px;color:#999;padding:.5rem 0">各要素のスコアを高めることで強みに変えていきましょう。改善ポイントのアドバイスを参考に取り組んでみてください。</p>';
  if(!nl.innerHTML) nl.innerHTML = '<p style="font-size:13px;color:#999;padding:.5rem 0">強みが増えてきたら、さらに高めるヒントが表示されます。</p>';
  if(weakCount === 0) wl.innerHTML = '<p style="font-size:13px;color:#999;padding:.5rem 0">3点未満の質問はありません。全体的に良好な状態です。上の「さらに高めるヒント」を参考に次のレベルを目指しましょう。</p>';

  // answer list
  let html = '';
  cats.forEach(c=>{
    const cqs = qs.map((q,i)=>({...q,i})).filter(q=>q.c===c.id);
    const cscore = Math.round(cqs.reduce((s,q)=>s+(ans[q.i]||3),0)/5*10)/10;
    html += `<div class="ans-group">
      <div class="ans-group-head" style="border-color:${c.color}30">
        <span class="ans-group-name" style="color:${c.color}">${c.name}</span>
        <span class="ans-group-score" style="color:${c.color}">${cscore.toFixed(1)}点</span>
      </div>`;
    cqs.forEach(q=>{
      const v = ans[q.i]||0;
      const dots = [1,2,3,4,5].map(n=>`<div class="dot${n<=v?' on':''}" style="${n<=v?'background:'+c.color:''}"></div>`).join('');
      html += `<div class="ans-row">
        <div class="ans-q"><span class="qno">Q${q.i+1}</span>${q.q}</div>
        <div class="ans-right">
          <div class="dots">${dots}</div>
          <span class="ans-label">${v?scaleText[v]:'未回答'}</span>
        </div>
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('ans-list').innerHTML = html;
}

function dlCSV(){
  const sc = scores();
  const now = new Date();
  const d = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
  let csv = '\uFEFF診断日,要素,スコア,評価\n';
  sc.forEach(s=>{ csv += `${d},${s.c.name},${s.score.toFixed(1)},${s.score>=3?'強み':'改善ポイント'}\n`; });
  csv += '\n設問番号,要素,質問,回答（数値）,回答（テキスト）\n';
  qs.forEach((q,i)=>{
    const c = cat(q.c);
    const v = ans[i]||'';
    csv += `${i+1},${c.name},"${q.q}",${v},${v?scaleText[v]:''}\n`;
  });
  const url = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href=url; a.download=`longevity_skill_${d.replace(/\//g,'')}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('CSVをダウンロードしました');
}

    <div style="text-align:center;background:#f4f4f2;border-radius:8px;padding:8px 4px">
      <div style="font-size:10px;color:#888;margin-bottom:2px">${s.c.name}</div>
      <div style="font-size:20px;font-weight:700;color:${s.c.color}">${s.score.toFixed(1)}</div>
    </div>`).join('');

  const sorted = [...sc].sort((a,b)=>b.score-a.score);
  const strongItems = sorted.filter(s=>s.score>=3.0);

  // 強み
  let strongHtml = '';
  strongItems.forEach(s=>{
    strongHtml += `<div style="border-left:3px solid ${s.c.color};padding:8px 12px;margin-bottom:8px;background:#fafafa;border-radius:0 6px 6px 0">
      <div style="font-size:12px;font-weight:700;color:${s.c.color};margin-bottom:4px">${s.c.name}（${s.score.toFixed(1)}点）</div>
      <div style="font-size:11px;color:#444;line-height:1.65">${advice[s.c.id].h}</div>
    </div>`;
  });
  document.getElementById('pdf-strong').innerHTML = strongHtml || '<p style="font-size:11px;color:#999">各要素のスコアを高めることで強みに変えていきましょう。</p>';

  // さらに高めるヒント
  let nextHtml = '';
  strongItems.forEach(s=>{
    nextHtml += `<div style="border-left:3px solid #378ADD;padding:8px 12px;margin-bottom:8px;background:#fafafa;border-radius:0 6px 6px 0">
      <div style="font-size:12px;font-weight:700;color:#378ADD;margin-bottom:4px">${s.c.name}</div>
      <div style="font-size:11px;color:#444;line-height:1.65">${advice[s.c.id].n}</div>
    </div>`;
  });
  document.getElementById('pdf-next').innerHTML = nextHtml || '<p style="font-size:11px;color:#999">強みが増えてきたら、さらに高めるヒントが表示されます。</p>';

  // 改善ポイント（質問単位でスコア3未満）
  let weakHtml = '';
  cats.forEach(c=>{
    const catQs = qs.map((q,i)=>({...q,i})).filter(q=>q.c===c.id);
    catQs.forEach((q,qi)=>{
      const v = ans[q.i]||0;
      if(v>0 && v<3){
        weakHtml += `<div style="border-left:3px solid ${c.color};padding:8px 12px;margin-bottom:8px;background:#fafafa;border-radius:0 6px 6px 0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="font-size:12px;font-weight:700;color:${c.color}">${c.name}</span>
            <span style="font-size:10px;color:#bbb">Q${q.i+1} — ${v}点</span>
          </div>
          <div style="font-size:10px;color:#888;margin-bottom:4px;font-style:italic">「${q.q}」</div>
          <div style="font-size:11px;color:#444;line-height:1.65">${advice[c.id].q[qi]}</div>
        </div>`;
      }
    });
  });
  document.getElementById('pdf-weak').innerHTML = weakHtml || '<p style="font-size:11px;color:#999">3点未満の項目はありません。全体的に良好な状態です。</p>';

  // 回答一覧（要素ごとに個別divに書き込む）
  cats.forEach(c=>{
    const cqs = qs.map((q,i)=>({...q,i})).filter(q=>q.c===c.id);
    const cscore = Math.round(cqs.reduce((s,q)=>s+(ans[q.i]||3),0)/5*10)/10;
    let html = `<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid ${c.color}40;padding-bottom:6px;margin-bottom:10px">
      <span style="font-size:13px;font-weight:700;color:${c.color}">${c.name}</span>
      <span style="font-size:13px;font-weight:700;color:${c.color}">${cscore.toFixed(1)}点</span>
    </div>`;
    cqs.forEach(q=>{
      const v = ans[q.i]||0;
      const dots = [1,2,3,4,5].map(n=>`<span style="display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:2px;background:${n<=v?c.color:'#e0e0e0'}"></span>`).join('');
      html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f0">
        <div style="font-size:11px;color:#555;flex:1;padding-right:12px;line-height:1.55"><span style="color:#ccc;margin-right:4px">Q${q.i+1}</span>${q.q}</div>
        <div style="text-align:right;flex-shrink:0"><div>${dots}</div><span style="font-size:10px;color:#999">${v?scaleText[v]:'未回答'}</span></div>
      </div>`;
    });
    const el = document.getElementById(`pdf-answers-${c.id}`);
    if(el) el.innerHTML = html;
  });

  // セクション単位でキャプチャしてPDF生成
  await new Promise(r=>setTimeout(r,400));
  const root = document.getElementById('pdf-root');
  root.style.left = '0';
  root.style.zIndex = '-1';

  try {
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
    const pageW = 210, pageH = 297, margin = 15;
    const contentW = pageW - margin * 2;
    const maxContentH = pageH - margin * 2;

    // 回答一覧ヘッダーと各要素を別ページとして扱う
    const sectionIds = [
      'pdf-p1','pdf-p2','pdf-p3',
      'pdf-ans-pg1','pdf-ans-pg2','pdf-ans-pg3','pdf-ans-pg4'
    ];
    let isFirst = true;

    for(const sid of sectionIds){
      const sec = document.getElementById(sid);
      if(!sec) continue;
      const canvas = await html2canvas(sec,{scale:2,useCORS:true,logging:false,backgroundColor:'#ffffff'});
      const imgNativeH = canvas.height * contentW / canvas.width;
      if(!isFirst) pdf.addPage();
      isFirst = false;
      if(imgNativeH <= maxContentH){
        pdf.addImage(canvas.toDataURL('image/png'),'PNG',margin,margin,contentW,imgNativeH);
      } else {
        const scaleRatio = canvas.width / contentW;
        const pageHpx = maxContentH * scaleRatio;
        let yPx = 0;
        let firstSlice = true;
        while(yPx < canvas.height){
          if(!firstSlice) pdf.addPage();
          firstSlice = false;
          const sliceH = Math.min(pageHpx, canvas.height - yPx);
          const tmp = document.createElement('canvas');
          tmp.width = canvas.width; tmp.height = sliceH;
          const ctx = tmp.getContext('2d');
          ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,tmp.width,tmp.height);
          ctx.drawImage(canvas,0,yPx,canvas.width,sliceH,0,0,canvas.width,sliceH);
          const sliceImgH = sliceH * contentW / canvas.width;
          pdf.addImage(tmp.toDataURL('image/png'),'PNG',margin,margin,contentW,sliceImgH);
          yPx += sliceH;
        }
      }
    }

    const fname = `longevity_skill_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.pdf`;
    pdf.save(fname);
    toast('PDFをダウンロードしました');
  } catch(e){
    console.error(e);
    toast('PDF生成に失敗しました');
  } finally {
    root.style.left = '-9999px';
    root.style.zIndex = '';
  }
}

function testFill(){
  // 前川さんの実際の回答データで自動入力
  const testData = [5,3,4,5,4, 5,4,4,4,3, 5,5,4,4,4, 5,5,3,4,4, 5,4,5,3,3, 3,4,4,4,2, 4,4,4,5,5];
  testData.forEach((v,i)=>{ ans[i]=v; });
  showResult();
}

function restart(){
  ans.fill(null); cur=0;
  localStorage.removeItem(SAVE_KEY);
  document.getElementById('result-view').style.display='none';
  document.getElementById('quiz-view').style.display='block';
  document.getElementById('saved-badge').classList.remove('show');
  render();
  window.scrollTo(0,0);
}

checkLocal();
render();
</script>
